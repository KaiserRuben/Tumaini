server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite-hashed assets — content-addressed, cache forever
    location ^~ /assets/ {
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Other static (favicon, fonts, images shipped in dist) — moderate cache
    location ~* \.(?:woff2?|ttf|eot|png|jpe?g|gif|webp|svg|ico)$ {
        expires off;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # SPA shell — never cache: it references hashed assets
    location = /index.html {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/wasm;
}
