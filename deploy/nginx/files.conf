server {
    listen 80;
    server_name _;
    root /data;

    # Uploaded media — filenames are stable (admin uploads new names rather
    # than overwriting), so cache aggressively. If a filename is reused the
    # cache will serve the old image until expiry.
    location / {
        autoindex off;
        try_files $uri =404;
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
    }

    gzip on;
    gzip_types image/svg+xml text/plain application/json;
}
