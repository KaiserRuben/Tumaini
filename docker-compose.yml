services:
  mongo:
    image: mongo:7
    container_name: tumaini-mongo
    ports:
      - "27017:27017"
    volumes:
      - tumaini-mongo-data:/data/db
    healthcheck:
      test: mongosh --quiet --eval "db.runCommand('ping').ok"
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tumaini-mongo-data:
